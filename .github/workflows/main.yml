name: CI Pipeline
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          pip install pytest requests selenium webdriver-manager
      - name: Run API Tests
        run: pytest api_testing/
      - name: Run Web Tests
        run: pytest web_testing/